<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پوستر خەتمی قورئان - نسخه هوشمند و نهایی</title>
    
    <!-- لود سریع‌تر فونت‌ها برای جلوگیری از پرش -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0; padding: 0; background-color: #111111;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Vazirmatn', sans-serif;
            overflow: hidden; /* جلوگیری از اسکرول تا زمان لود کامل */
        }

        /* لایه لودینگ تاریک تمام صفحه */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000; /* مشکی مطلق */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }

        /* انیمیشن درخشش طلایی فانوس */
        .lantern-loader {
            width: 80px; /* سایز متناسب برای مرکز صفحه */
            filter: 
                invert(76%) sepia(43%) saturate(447%) hue-rotate(346deg) brightness(101%) contrast(93%);
            animation: pulse-lantern 1.8s infinite alternate ease-in-out;
        }

        @keyframes pulse-lantern {
            0% { 
                transform: scale(0.95); 
                filter: invert(76%) sepia(43%) saturate(447%) hue-rotate(346deg) brightness(101%) contrast(93%) drop-shadow(0 0 10px rgba(212, 175, 55, 0.4)); 
                opacity: 0.7; 
            }
            100% { 
                transform: scale(1.08); 
                filter: invert(76%) sepia(43%) saturate(447%) hue-rotate(346deg) brightness(101%) contrast(93%) drop-shadow(0 0 35px rgba(212, 175, 55, 0.9)); 
                opacity: 1; 
            }
        }

        /* ظرف اصلی پوستر */
        .poster-container {
            width: 100%;
            max-width: 400px;
            container-type: inline-size;
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            opacity: 0; /* در ابتدا مخفی است تا لودینگ تمام شود */
            transition: opacity 0.8s ease-in;
        }

        .poster {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-image: url('bg-blank.webp');
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow: hidden;
            direction: rtl;
        }

        /* استایل مشترک متن‌ها */
        .dynamic-text {
            position: absolute;
            left: 0; right: 0;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .juz-text {
            top: 68%; 
            font-size: 3cqi; 
            font-weight: 900;
        }

        .mosque-text {
            top: 81%; 
            font-size: 3.25cqi; 
            font-weight: 700;
            padding: 0 5%;
            line-height: 1.4;
        }

        .date-time-text {
            top: 87.6%; 
            font-size: 2cqi; 
            font-weight: 700;
            line-height: 1.8; 
            color: #e0e0e0;
        }

        .date-time-wrapper {
            display: inline-block;
            text-align: right;
        }

        .hidden { display: none !important; }
    </style>
</head>

        const kurdishMonths = {"1": "خاکەلێوە", "2": "بانەمەڕ", "3": "جۆزەردان", "4": "پووشپەڕ", "5": "خەرمانان", "6": "گەلاوێژ", "7": "ڕەزبەر", "8": "گەڵاڕێزان", "9": "سەرماوەز", "10": "بەفرانبار", "11": "ڕێبەندان", "12": "ڕەشەمە"};
        const kurdishOrdinals = ['یەکەم', 'دووهەم', 'سێیەم', 'چوارەم', 'پێنجەم', 'شەشەم', 'حەوتەم', 'هەشتەم', 'نۆیەم', 'دەیەم', 'یانزەیەم', 'دوانزەیەم', 'سیانزەیەم', 'چواردەیەم', 'پازدەیەم', 'شازدەیەم', 'حەڤدەیەم', 'هەژدەیەم', 'نۆزدەیەم', 'بیستەم', 'بیست و یەکەم', 'بیست و دووهەم', 'بیست و سێیەم', 'بیست و چوارەم', 'بیست و پێنجەم', 'بیست و شەشەم', 'بیست و حەوتەم', 'بیست و هەشتەم', 'بیست و نۆیەم', 'سییەم'];

        let preloaderHidden = false;

        // تابع مخفی کردن لودینگ و نمایش پوستر
        function hidePreloader() {
            if (preloaderHidden) return;
            preloaderHidden = true;
            
            const loader = document.getElementById("loading-screen");
            const posterContainer = document.getElementById("poster-container");
            const content = document.getElementById("content");
            
            loader.style.opacity = '0'; // محو شدن پرده مشکی
            
            setTimeout(() => {
                loader.style.display = 'none';
                posterContainer.style.opacity = '1'; // ظاهر شدن پوستر
                content.classList.remove('hidden');  // ظاهر شدن متن‌ها
            }, 800); // همگام با پایان انیمیشن CSS
        }

        function getNextWedForPoster() {
            let now = new Date();
            let target = new Date();
            let daysUntilWed = (3 - now.getDay() + 7) % 7; 
            target.setDate(now.getDate() + daysUntilWed);

            const formatter = new Intl.DateTimeFormat('fa-IR-u-nu-latn', {timeZone: 'Asia/Tehran', year:'numeric', month: 'numeric', day: 'numeric'});
            let parts = formatter.formatToParts(target);
            let y = parts.find(p=>p.type==='year').value;
            let m = parts.find(p=>p.type==='month').value;
            let d = parts.find(p=>p.type==='day').value;

            let isha = (yearTimes[m] && yearTimes[m][d]) ? yearTimes[m][d][5] : "19:30"; 
            let [h, min] = isha.split(':');
            let ishaHour24 = parseInt(h, 10);
            if (ishaHour24 < 12) ishaHour24 += 12; 
            
            let resetTime = new Date(target);
            resetTime.setHours(ishaHour24 + 2, parseInt(min, 10), 0, 0);

            if (now.getTime() >= resetTime.getTime()) {
                target.setDate(target.getDate() + 7);
                parts = formatter.formatToParts(target);
                y = parts.find(p=>p.type==='year').value;
                m = parts.find(p=>p.type==='month').value;
                d = parts.find(p=>p.type==='day').value;
            }

            return { targetObj: target, year: y, month: m, day: d };
        }

        function applyPosterData(data) {
            let startD = new Date(data.startDate);
            if (isNaN(startD.getTime())) {
                startD = new Date("2026-10-07T00:00:00");
            }
            
            let wed = getNextWedForPoster();
            let diffWeeks = Math.round((wed.targetObj - startD) / (1000 * 60 * 60 * 24 * 7));
            if (diffWeeks < 0) diffWeeks = 0;
            let calculatedJuz = (diffWeeks % 30) + 1;
            
            let manualJuzNum = parseInt(data.manualJuz, 10);
            let finalJuz = (!isNaN(manualJuzNum) && manualJuzNum >= 1 && manualJuzNum <= 30) ? manualJuzNum : calculatedJuz;
            let juzWordKu = kurdishOrdinals[finalJuz - 1] || toPersianNum(finalJuz);

            document.getElementById('p-juz').innerText = `تیلاوەتی جوزئی ${juzWordKu}`;
            document.getElementById('p-mosque').innerText = data.mosque || "مزگەوتی دیاریکراو";
            document.getElementById('p-date').innerText = toPersianNum(`📅 چوارشەممە ${wed.day}ی ${kurdishMonths[wed.month]}ی ${wed.year}`);
        }

        async function initPoster() {
            // سوپاپ اطمینان: تایمر نجات ۶ ثانیه‌ای
            setTimeout(hidePreloader, 6000);

            // نمایش موقت اطلاعات بر اساس زمان
            let wed = getNextWedForPoster();
            document.getElementById('p-date').innerText = toPersianNum(`📅 چوارشەممە ${wed.day}ی ${kurdishMonths[wed.month]}ی ${wed.year}`);
            
            // ۱. پیمان (Promise) لود شدن پس‌زمینه اصلی پوستر
            const bgImg = new Image();
            const bgPromise = new Promise(resolve => {
                bgImg.onload = resolve;
                bgImg.onerror = resolve; // اگر عکس خراب بود هم قفل نشود
                bgImg.src = 'bg-blank.webp';
            });

            // ۲. پیمان لود شدن فونت وزیرمتن
            const fontPromise = document.fonts.ready;

            // ۳. پیمان دریافت اطلاعات از گوگل‌شیت
            const dataPromise = new Promise(async (resolve) => {
                const cachedData = localStorage.getItem('quran_baneh_cache');
                if (cachedData) {
                    try { applyPosterData(JSON.parse(cachedData)); } catch (e) {}
                }

                try {
                    let noCacheUrl = GOOGLE_API_URL + "?t=" + new Date().getTime();
                    let response = await fetch(noCacheUrl);
                    let freshData = await response.json();
                    
                    localStorage.setItem('quran_baneh_cache', JSON.stringify(freshData));
                    applyPosterData(freshData);
                    resolve();
                } catch (error) {
                    console.error("Error fetching poster data:", error);
                    resolve(); // حتی با ارور هم اجازه لود شدن پوستر را بده
                }
            });

            // فقط زمانی پرده فانوس را کنار بزن که: 
            // عکس بک‌گراند ۱۰۰٪ دانلود شده + فونت دانلود شده + اطلاعات دریافت شده (یا تایمر ۶ ثانیه سر رسیده باشد)
            Promise.all([bgPromise, fontPromise, dataPromise]).then(() => {
                hidePreloader();
            });
        }

        document.addEventListener("DOMContentLoaded", initPoster);
    </script>
